<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2128">
<title>Energy Counter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 32'><rect x='1' y='2' width='18' height='29' rx='4' fill='%23c9ced6'/><rect x='3' y='0' width='14' height='4' rx='2' fill='%238a919c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #1d2128;
    --raised: #272c35;
    --line: #353b46;
    --text: #e8eaed;
    --muted: #959ca8;
    --silver: #d9dde3;
    --danger: #f08a7e;
    --live: #6fcf8e;
    --redbull: #5b8cf0;
    --clever: #4fbf73;
    --sbudget: #ef6a5b;
    --other: #8a919c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.5 "Archivo", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  .narrow { font-stretch: 72%; font-weight: 750; letter-spacing: -0.01em; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { font-size: 2.5rem; line-height: 1; margin: 0; }
  #status { font-size: .875rem; color: var(--muted); white-space: nowrap; }
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px;
  }
  #status.live { color: var(--live); }
  #status.off { color: var(--danger); }

  /* The shelf: one can per entry, grouped by brand */
  .shelf {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 2px;
    margin: 28px 0 20px; min-height: 48px;
  }
  .can-img { height: 48px; width: auto; display: block; }
  .can {
    width: 20px; height: 46px; position: relative;
    border-radius: 3px 3px 4px 4px;
    background:
      linear-gradient(90deg, rgb(0 0 0 / .18), rgb(255 255 255 / .22) 30%, transparent 55%, rgb(0 0 0 / .22)),
      var(--c);
  }
  .can::before {
    content: ""; position: absolute; left: 1px; right: 1px; top: -2px; height: 4px;
    border-radius: 2px; background: #b9bec7;
  }
  .can.new, .can-img.new { animation: drop .45s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  .shelf-empty { color: var(--muted); }

  .totals { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 0 0 24px; }

  .goal { margin: 0 0 40px; }
  .goal-head { display: flex; justify-content: space-between; gap: 12px; font-size: .875rem; color: var(--muted); }
  .goal-head b { color: var(--text); font-weight: 600; }
  .goal-track { height: 10px; margin: 8px 0 6px; border-radius: 5px; background: var(--raised); overflow: hidden; }
  .goal-fill { height: 100%; border-radius: 5px; background: var(--silver); transition: width .6s ease; }
  .goal.done .goal-fill { background: var(--live); }
  .goal-left { font-size: .875rem; color: var(--muted); }
  .totals div { color: var(--muted); }
  .totals b { font-size: 1.75rem; color: var(--text); margin-right: 6px; }

  form { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; margin-bottom: 48px; }
  label { display: grid; gap: 4px; font-size: .875rem; color: var(--muted); min-width: 0; }
  select, button { font: inherit; color: inherit; }
  select {
    appearance: none; width: 100%; min-width: 0;
    padding: 11px 34px 11px 12px; border-radius: 8px;
    background: var(--raised) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23959ca8' stroke-width='1.6'/></svg>") no-repeat right 12px center;
    border: 1px solid var(--line); color: var(--text);
    text-overflow: ellipsis;
  }
  .submit {
    grid-column: 1 / -1; margin-top: 4px; padding: 14px; border: 0; border-radius: 8px;
    background: var(--silver); color: #1d2128; font-weight: 650; font-size: 1.05rem; cursor: pointer;
  }
  .submit:hover { background: #fff; }
  .submit:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }

  h2 { font-size: 1.5rem; margin: 0 0 8px; }
  section { margin-bottom: 44px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li {
    display: grid; grid-template-columns: 1fr auto 6.5rem; gap: 12px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .rows .n { color: var(--muted); text-align: right; }
  .rows .eur { text-align: right; }
  .swatch { display: inline-block; width: 8px; height: 14px; border-radius: 2px; background: var(--c); margin-right: 10px; vertical-align: -1px; }
  .rows li.zero { color: var(--muted); }

  .log li { grid-template-columns: 1fr auto auto; }
  .log .what { min-width: 0; }
  .rows .meta { display: block; font-size: .875rem; color: var(--muted); }
  .link {
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
  }
  .link:hover { color: var(--text); }
  .log .link:hover { color: var(--danger); }
  .more { margin-top: 12px; }

  footer { display: flex; gap: 20px; font-size: .875rem; }
  body:not([data-role="submitter"]) #mine { display: none; }
  body[data-role="submitter"] #history [data-id], body[data-role="submitter"] #import { display: none; }
  .note { margin: 0 0 8px; color: var(--muted); }
  #review-list li { grid-template-columns: 1fr auto; }
  .actions { grid-column: 1 / -1; display: flex; gap: 20px; }
  .log .actions .link:first-child:hover { color: var(--live); }
  .state { font-size: .875rem; color: var(--muted); text-align: right; }
  .state.angenommen { color: var(--live); }
  .state.abgelehnt { color: var(--danger); }
  .account { margin: 12px 0 0; font-size: .875rem; color: var(--muted); }

  /* Daily Bild: a month calendar with one picture per day */
  .cal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; }
  .cal-nav { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .cal-nav span { min-width: 8.5em; text-align: center; }
  .cal-nav button {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); cursor: pointer; line-height: 1;
  }
  .cal-nav button:disabled { opacity: .35; cursor: default; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wd { font-size: .75rem; color: var(--muted); text-align: center; }
  .day {
    aspect-ratio: 1; position: relative; padding: 0; overflow: hidden; cursor: pointer;
    border-radius: 6px; border: 1px solid transparent; background: var(--raised) center / cover no-repeat;
    font: inherit; font-size: .8rem; color: var(--muted);
  }
  .day span { position: absolute; left: 5px; top: 3px; }
  .day.has span { color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / .8); }
  .day:not(.has):not(:disabled):hover { border-color: var(--line); color: var(--text); }
  .day.today { border-color: var(--silver); color: var(--text); }
  .day:disabled { opacity: .35; cursor: default; }
  .day.pad { visibility: hidden; }
  .cal-foot { margin-top: 12px; }
  .cal-foot .submit { width: 100%; }

  dialog {
    width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 16px;
    background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .65); }
  #viewer h3 { margin: 0 0 12px; font-size: 1.25rem; }
  #viewer img { display: block; width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; background: var(--bg); }
  #viewer .meta { margin: 8px 0 0; font-size: .875rem; color: var(--muted); }
  #viewer .actions { margin-top: 12px; }
  #viewer .actions .close { margin-left: auto; }
  #viewer-delete:hover { color: var(--danger); }

  body:not([data-auth="in"]) #app, body[data-auth="in"] #gate { display: none; }
  body:not([data-auth="in"]) #status { visibility: hidden; }
  #gate { margin-top: 40px; max-width: 34em; }
  #gate p { margin: 0 0 20px; color: var(--muted); font-size: 1.1rem; }
  #gate .submit { width: 100%; max-width: 320px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    background: var(--silver); color: #1d2128; padding: 10px 16px; border-radius: 8px;
    max-width: calc(100% - 32px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    h1 { font-size: 2rem; }
    form { grid-template-columns: 1fr 1fr; }
    form label:nth-child(3) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .can.new, .can-img.new { animation: none; }
    .toast, .goal-fill { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="narrow">Energy Counter</h1>
    <span id="status"></span>
  </header>

  <section id="gate">
    <p id="gate-text">Lade…</p>
    <button class="submit" id="signin" type="button" hidden>Mit Google anmelden</button>
  </section>

  <div id="app">
  <div class="shelf" id="shelf" aria-label="Alle getrunkenen Dosen"></div>
  <div class="totals" id="totals"></div>
  <div class="goal" id="goal"></div>

  <form id="add">
    <label>Wer
      <select id="person" required></select>
    </label>
    <label>Marke
      <select id="brand" required></select>
    </label>
    <label>Geschmack
      <select id="flavor" required></select>
    </label>
    <button class="submit" type="submit">Dose eintragen</button>
  </form>

  <section id="review" hidden>
    <h2 class="narrow">Zur Freigabe</h2>
    <ul class="rows log" id="review-list"></ul>
  </section>

  <section id="mine">
    <h2 class="narrow">Deine Einträge</h2>
    <p class="note">Deine Dosen zählen, sobald sie freigegeben sind.</p>
    <ul class="rows log" id="mine-list"></ul>
  </section>

  <section id="daily">
    <div class="cal-head">
      <h2 class="narrow">Daily Bild</h2>
      <div class="cal-nav">
        <button id="cal-prev" type="button" aria-label="Vorheriger Monat">‹</button>
        <span id="cal-month"></span>
        <button id="cal-next" type="button" aria-label="Nächster Monat">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="cal-foot" id="cal-foot"></div>
    <input type="file" id="dailyFile" accept="image/*" hidden>
  </section>

  <section>
    <h2 class="narrow">Marken</h2>
    <ul class="rows" id="brands"></ul>
  </section>

  <section>
    <h2 class="narrow">Leute</h2>
    <ul class="rows" id="people"></ul>
  </section>

  <section>
    <h2 class="narrow">Zuletzt</h2>
    <ul class="rows log" id="history"></ul>
    <button class="link more" id="more" type="button" hidden></button>
  </section>

  <footer>
    <button class="link" id="export" type="button">Daten exportieren</button>
    <button class="link" id="import" type="button">Daten importieren</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
  <p class="account"><span id="who"></span> <button class="link" id="signout" type="button">Abmelden</button></p>
  </div>
</main>
<dialog id="viewer">
  <h3 class="narrow" id="viewer-date"></h3>
  <img id="viewer-img" alt="">
  <p class="meta" id="viewer-meta"></p>
  <div class="actions">
    <button class="link" id="viewer-replace" type="button">Ersetzen</button>
    <button class="link" id="viewer-delete" type="button">Löschen</button>
    <button class="link close" id="viewer-close" type="button">Schließen</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const PFAND = 25; // cents per can
  const CAN_ML = 250; // every can, every brand
  const CAFFEINE_PER_100ML = 32; // mg, same for every brand
  const PEOPLE = ["Hut", "Karsten", "Sophie", "Kongi", "Noah", "Unbekannt", "Gast"];
  // flavors: name -> can photo in cans/ (null = use the brand's classic can)
  const BRANDS = {
    redbull: {

        "Ice Edition (Iced Gummy Bear)": "rb-ice",
        "Lilac Edition Sugarfree": "rb-lilac",
        "Glacier Edition (Gletschereis-Himbeere)": null,
        "Pink Edition Sugarfree (Waldbeere)": "rb-pink",
        "Cherry Edition Sugarfree (Kirsche-Sakura)": "rb-cherry",
        "Winter Edition (Pistazie)": "rb-pistachio",
        "Winter Edition Sugarfree (Pistazie)": "rb-pistachio-sf",
        "Winter Edition 2025 (Fuji-Apfel & Ingwer)": "rb-fuji",
        "Sugarfree Sudachi": "rb-sudachi",
        "Summer Edition": "rb-sudachi",
        "Andere": null,
      },
    },
    clever: {
      name: "clever Energy", price: 49, color: "--clever", can: "cl-classic",
      flavors: {
        "Classic": "cl-classic",
        "Sugarfree": "cl-zero",
        "Zero": "cl-zero",
        "Kiwi": "cl-kiwi",
        "Erdbeer-Limette": "cl-erdbeer-limette",
        "Honigmelone": "cl-honigmelone",
        "Ananas": "cl-ananas",
        "Heidelbeere": "cl-heidelbeere",
        "White Peach": "cl-peach",
        "Juneberry": null,
        "Marille-Holler": null,
        "Drachenfrucht": null,
        "Andere": null,
      },
    },
    sbudget: {
      name: "S-Budget Energy", price: 59, color: "--sbudget", can: "sb-classic",
      flavors: {
        "Classic": "sb-classic",
        "Sugarfree": "sb-sugarfree",
        "Sugarfree Limette": "sb-sf-limette",
        "Sugarfree Heidelbeere": "sb-sf-heidelbeere",
        "Energy Cola": "sb-cola",
        "Heidelbeere": "sb-heidelbeere",
        "Kirsche": null,
        "Kirsche-Banane": "sb-kirsche-banane",
        "Pfirsich": null,
        "Limette": "sb-limette",
        "Cranberry": null,
        "Wassermelone": "sb-wassermelone",
        "Marille-Erdbeere": "sb-marille-erdbeere",
        "Kokos-Heidelbeere": "sb-kokos-heidelbeere",
        "Juneberry": "sb-juneberry",
        "Sour Ananas": "sb-sour-ananas",
        "Tutti Frutti": "sb-tutti-frutti",
        "1001 Nacht": "sb-1001",
        "Andere": null,
      },
    },
    other: {
      name: "Unbekannt/Gast", price: 0, color: "--other", can: null,
      flavors: { "Unbekannt": null, "Gastdose": null },
    },
  };
  const DB_URL = "https://energy-counter-4ahitm-default-rtdb.europe-west1.firebasedatabase.app";
  const LEGACY_KEY = "energy-counter-v1"; // entries saved locally before the sync existed
  const LOG_SHORT = 12;
  const GOAL_CANS = 400; // = 100 € Pfand
  // Daily Bild: photos are shrunk in the browser and stored as JPEG data URLs in the database
  const DAILY_FULL = 1280; // px, long edge of the stored picture
  const DAILY_THUMB = 240; // px, square calendar thumbnail
  const DAILY_MAX = 1400000; // chars, stays under the limit in database.rules.json

  // Public web config; who may read/write is decided by database.rules.json
  const auth = getAuth(initializeApp({
    apiKey: "AIzaSyDcZL-bcPbEJ7dyjbiC-AQJlociVhZNIGs",
    authDomain: "energy-counter-4ahitm.firebaseapp.com",
    databaseURL: DB_URL,
    projectId: "energy-counter-4ahitm",
    appId: "1:526770112304:web:9a841f66b92da4149a6af5",
  }));

  // Roles for the UI only; database.rules.json is what enforces them
  const ADMIN = "x2clemens@gmail.com";
  const NEEDS_APPROVAL = ["kemplsophie@gmail.com"];
  const STATUS = { offen: "wartet auf Freigabe", angenommen: "angenommen", abgelehnt: "abgelehnt" };

  const $ = (id) => document.getElementById(id);
  const liters = (cans) => (cans * CAN_ML / 1000).toLocaleString("de-AT", { maximumFractionDigits: 2 }) + " l";
  const caffeine = (cans) => (cans * CAN_ML * CAFFEINE_PER_100ML / 100).toLocaleString("de-AT") + " mg Koffein";
  const euro = (cents) => (cents / 100).toLocaleString("de-AT", { style: "currency", currency: "EUR" });
  const unit = (brand) => BRANDS[brand].price + PFAND;
  const canImage = (e) => BRANDS[e.brand].flavors[e.flavor] ?? BRANDS[e.brand].can;
  const label = (e) => e.brand === "other" ? e.flavor : `${BRANDS[e.brand].name} ${e.flavor}`;
  const timeFmt = new Intl.DateTimeFormat("de-AT", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
  const monthFmt = new Intl.DateTimeFormat("de-AT", { month: "long", year: "numeric" });
  const dayFmt = new Intl.DateTimeFormat("de-AT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const shortDayFmt = new Intl.DateTimeFormat("de-AT", { day: "numeric", month: "long" });
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const parseDay = (key) => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); };

  // Firebase Realtime Database, spoken to over its REST API; `store` mirrors /entries as {id: entry},
  // `pending` mirrors /pending as {uid: {id: submission}}, `mine` a submitter's own /pending/<uid>,
  // `daily` mirrors /daily as {"YYYY-MM-DD": {ts, by, thumb}}; full pictures in /dailyImg load on demand.
  let store = {};
  let pending = {};
  let mine = {};
  let daily = {};
  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let pickDay = null; // day the file picker is choosing a picture for
  let viewing = null; // day shown in the viewer dialog
  let role = null;
  let entries = [];
  let loaded = false;
  let showAll = false;
  let justAdded = null;
  let streams = [];
  let session = 0; // bumped on every (re)start so callbacks from old streams are ignored

  function rebuild() {
    entries = Object.entries(store)
      .filter(([, e]) => e && e.brand in BRANDS)
      .map(([id, e]) => ({ id, ...e }))
      .sort((a, b) => a.ts - b.ts);
    render();
  }

  function setStatus(text, cls) {
    $("status").textContent = text;
    $("status").className = cls;
  }

  function setAuthState(state, text = "") {
    document.body.dataset.auth = state;
    $("gate-text").textContent = text;
    $("signin").hidden = state === "loading";
    $("signin").textContent = state === "denied" ? "Mit anderem Konto anmelden" : "Mit Google anmelden";
  }

  const authed = async (path) => `${DB_URL}${path}?auth=${await auth.currentUser.getIdToken()}`;

  function startSession() {
    const id = ++session;
    closeStreams();
    if (role === "submitter") {
      watch(`/pending/${auth.currentUser.uid}`, id, (data) => { mine = data; renderMine(); });
    }
    watch("/entries", id, (data) => {
      store = data;
      if (!loaded) { loaded = true; migrateLegacy(); }
      setAuthState("in");
      rebuild();
    });
    if (role === "admin") watch("/pending", id, (data) => { pending = data; renderReview(); });
    // a refused /daily only hides the calendar, it doesn't lock anyone out of the counter
    watch("/daily", id, (data) => { daily = data; renderDaily(); }, () => { $("daily").hidden = true; });
  }

  function closeStreams() {
    streams.forEach((es) => es.close());
    streams = [];
  }

  // Mirrors one database path live and calls onData with its whole value after every change
  async function watch(path, id, onData, onDenied = deny) {
    const url = await authed(`${path}.json`);
    if (id !== session) return;
    const es = new EventSource(url);
    streams.push(es);
    let root = {};
    const apply = (at, data) => {
      const keys = at.split("/").filter(Boolean);
      if (!keys.length) return void (root = data ?? {});
      let node = root;
      for (const k of keys.slice(0, -1)) node = node[k] ??= {};
      if (data === null) delete node[keys.at(-1)];
      else node[keys.at(-1)] = data;
    };
    es.addEventListener("put", (ev) => {
      const { path: at, data } = JSON.parse(ev.data);
      apply(at, data);
      setStatus("live", "live");
      onData(root);
    });
    es.addEventListener("patch", (ev) => {
      const { path: at, data } = JSON.parse(ev.data);
      for (const [k, v] of Object.entries(data)) apply(`${at}/${k}`, v);
      onData(root);
    });
    es.addEventListener("open", () => setStatus("live", "live"));
    es.addEventListener("error", async () => {
      if (id !== session) return;
      // the browser retries network drops by itself; a refused stream stays closed
      if (es.readyState !== EventSource.CLOSED) return setStatus("offline", "off");
      const res = await fetch(await authed(`${path}.json`) + "&shallow=true").catch(() => null);
      if (id !== session) return;
      if (res?.status === 401) return onDenied();
      setStatus("offline", "off");
      setTimeout(() => id === session && startSession(), 5000);
    });
    es.addEventListener("cancel", () => {
      if (id !== session) return;
      es.close();
      onDenied();
    });
    // ID tokens last an hour; the database ends the stream when one expires
    es.addEventListener("auth_revoked", () => {
      if (id === session) auth.currentUser?.getIdToken(true).then(startSession);
    });
  }

  function deny() {
    session++;
    closeStreams();
    setAuthState("denied", `${auth.currentUser?.email ?? "Dieses Konto"} ist für den Energy Counter nicht freigeschaltet.`);
  }

  async function write(path, method, body) {
    const res = await fetch(await authed(`${path}.json`), {
      method,
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(res.status);
  }
  const remote = (id, method, entry) => write(`/entries/${encodeURIComponent(id)}`, method, entry);

  async function upload(list) {
    await Promise.all(list.map(({ id, ts, person, brand, flavor, cents }) =>
      remote(id, "PUT", { ts, person, brand, flavor, cents })));
  }

  async function migrateLegacy() {
    let legacy;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || []; } catch { return; }
    const fresh = legacy.filter((e) => e && e.id && e.brand in BRANDS && !(e.id in store));
    try {
      await upload(fresh);
      localStorage.removeItem(LEGACY_KEY);
      if (fresh.length) toast(`${fresh.length} lokal gespeicherte Dosen hochgeladen`);
    } catch {}
  }

  function fillSelect(sel, options) {
    sel.innerHTML = "";
    for (const [value, label] of options) sel.add(new Option(label, value));
  }

  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }
  function recall(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }

  function initForm() {
    fillSelect($("person"), PEOPLE.map((p) => [p, p]));
    fillSelect($("brand"), Object.entries(BRANDS).map(([k, b]) => [k, `${b.name}, ${euro(unit(k))}`]));
    const lastPerson = recall("ec-person"), lastBrand = recall("ec-brand");
    if (PEOPLE.includes(lastPerson)) $("person").value = lastPerson;
    if (lastBrand in BRANDS) $("brand").value = lastBrand;
    updateFlavors();
    $("brand").addEventListener("change", updateFlavors);
  }

  function updateFlavors() {
    fillSelect($("flavor"), Object.keys(BRANDS[$("brand").value].flavors).map((f) => [f, f]));
  }

  function render() {
    const brandKeys = Object.keys(BRANDS);
    const byBrand = Object.fromEntries(brandKeys.map((k) => [k, 0]));
    const byPerson = Object.fromEntries(PEOPLE.map((p) => [p, { n: 0, cents: 0 }]));
    let cents = 0;
    for (const e of entries) {
      cents += e.cents;
      byBrand[e.brand]++;
      const p = byPerson[e.person] ??= { n: 0, cents: 0 };
      p.n++;
      p.cents += e.cents;
    }

    // grouped by brand, identical cans side by side
    const flavorRank = (e) => Object.keys(BRANDS[e.brand].flavors).indexOf(e.flavor);
    const shelf = brandKeys.flatMap((k) => entries.filter((e) => e.brand === k)
      .sort((a, b) => flavorRank(a) - flavorRank(b) || a.ts - b.ts));
    $("shelf").innerHTML = shelf.length
      ? shelf.map((e) => {
          const cls = e.id === justAdded ? " new" : "";
          const title = esc(`${label(e)}, ${e.person}`);
          const img = canImage(e);
          return img
            ? `<img class="can-img${cls}" src="cans/${img}.webp" alt="${title}" title="${title}">`
            : `<span class="can${cls}" style="--c: var(${BRANDS[e.brand].color})" title="${title}"></span>`;
        }).join("")
      : `<span class="shelf-empty">Noch keine Dosen. Trag unten die erste ein.</span>`;
    justAdded = null;

    $("totals").innerHTML = `
      <div><b class="narrow">${entries.length}</b>${entries.length === 1 ? "Dose" : "Dosen"}</div>
      <div><b class="narrow">${euro(cents)}</b>ausgegeben</div>
      <div><b class="narrow">${euro(entries.length * PFAND)}</b>Pfand</div>`;

    const n = entries.length, pct = Math.min(100, (n / GOAL_CANS) * 100);
    $("goal").classList.toggle("done", n >= GOAL_CANS);
    $("goal").innerHTML = `
      <div class="goal-head">
        <span>Ziel: <b>${GOAL_CANS} Dosen</b>, also <b>${euro(GOAL_CANS * PFAND)}</b> Pfand</span>
        <span>${Math.floor(pct)} %</span>
      </div>
      <div class="goal-track" role="progressbar" aria-label="Fortschritt zum Ziel"
        aria-valuemin="0" aria-valuemax="${GOAL_CANS}" aria-valuenow="${Math.min(n, GOAL_CANS)}">
        <div class="goal-fill" style="width: ${pct}%"></div>
      </div>
      <div class="goal-left">${n >= GOAL_CANS ? "Ziel erreicht!" : `Noch ${GOAL_CANS - n} ${GOAL_CANS - n === 1 ? "Dose" : "Dosen"} bis ${euro(GOAL_CANS * PFAND)} Pfand`}</div>`;

    $("brands").innerHTML = brandKeys.map((k) => `
      <li class="${byBrand[k] ? "" : "zero"}">
        <span><span class="swatch" style="--c: var(${BRANDS[k].color})"></span>${BRANDS[k].name}</span>
        <span class="n">${byBrand[k]}</span>
        <span class="eur">${euro(byBrand[k] * unit(k))}</span>
      </li>`).join("");

    $("people").innerHTML = Object.entries(byPerson)
      .sort((a, b) => b[1].n - a[1].n)
      .map(([name, p]) => `
        <li class="${p.n ? "" : "zero"}">
          <span class="what">${esc(name)}${p.n ? `
            <span class="meta">${liters(p.n)}, ${caffeine(p.n)}</span>` : ""}</span>
          <span class="n">${p.n}</span>
          <span class="eur">${euro(p.cents)}</span>
        </li>`).join("");

    const recent = [...entries].reverse();
    const shown = showAll ? recent : recent.slice(0, LOG_SHORT);
    $("history").innerHTML = shown.length
      ? shown.map((e) => `
        <li>
          <span class="what">${esc(label(e))}
            <span class="meta">${esc(e.person)}, ${timeFmt.format(new Date(e.ts))}</span></span>
          <span class="eur">${euro(e.cents)}</span>
          <button class="link" data-id="${esc(e.id)}" type="button">Löschen</button>
        </li>`).join("")
      : `<li class="zero"><span>Hier erscheinen die zuletzt eingetragenen Dosen.</span></li>`;
    $("more").hidden = recent.length <= LOG_SHORT;
    $("more").textContent = showAll ? "Weniger anzeigen" : `Alle ${recent.length} anzeigen`;
  }

  function renderReview() {
    const open = Object.entries(pending)
      .flatMap(([uid, items]) => Object.entries(items ?? {}).map(([id, e]) => ({ uid, id, ...e })))
      .filter((e) => e.status === "offen" && e.brand in BRANDS)
      .sort((a, b) => a.ts - b.ts);
    $("review").hidden = !open.length;
    $("review-list").innerHTML = open.map((e) => `
      <li>
        <span class="what">${esc(label(e))}
          <span class="meta">${esc(e.person)}, ${timeFmt.format(new Date(e.ts))}, von ${esc(e.by)}</span></span>
        <span class="eur">${euro(unit(e.brand))}</span>
        <span class="actions">
          <button class="link" type="button" data-uid="${esc(e.uid)}" data-id="${esc(e.id)}" data-ok="1">Annehmen</button>
          <button class="link" type="button" data-uid="${esc(e.uid)}" data-id="${esc(e.id)}" data-ok="0">Ablehnen</button>
        </span>
      </li>`).join("");
  }

  function renderMine() {
    const list = Object.entries(mine)
      .map(([id, e]) => ({ id, ...e }))
      .filter((e) => e.brand in BRANDS)
      .sort((a, b) => b.ts - a.ts);
    $("mine-list").innerHTML = list.length
      ? list.map((e) => `
        <li>
          <span class="what">${esc(label(e))}
            <span class="meta">${esc(e.person)}, ${timeFmt.format(new Date(e.ts))}</span></span>
          <span class="eur">${euro(e.cents)}</span>
          <span class="state ${STATUS[e.status] ? e.status : ""}">${STATUS[e.status] ?? ""}</span>
        </li>`).join("")
      : `<li class="zero"><span>Noch nichts eingetragen.</span></li>`;
  }

  const canPost = () => role === "admin" || role === "member";
  const isJpeg = (s) => typeof s === "string" && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s);

  function renderDaily() {
    const now = new Date(), today = dayKey(now);
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const days = new Date(y, m + 1, 0).getDate();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; // weeks start on Monday
    $("cal-month").textContent = monthFmt.format(calMonth);
    $("cal-next").disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
    const cells = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((d) => `<span class="wd">${d}</span>`);
    for (let i = 0; i < lead; i++) cells.push(`<span class="day pad"></span>`);
    for (let d = 1; d <= days; d++) {
      const key = dayKey(new Date(y, m, d)), pic = isJpeg(daily[key]?.thumb) ? daily[key] : null;
      const cls = ["day", pic && "has", key === today && "today"].filter(Boolean).join(" ");
      const off = key > today || (!pic && !canPost());
      const name = `${shortDayFmt.format(new Date(y, m, d))}, ${pic ? "Bild ansehen" : "Bild hochladen"}`;
      cells.push(`<button class="${cls}" type="button" data-day="${key}" aria-label="${name}"${off ? " disabled" : ""}
        ${pic ? `style="background-image: url('${pic.thumb}')"` : ""}><span>${d}</span></button>`);
    }
    $("cal").innerHTML = cells.join("");
    $("cal-foot").innerHTML = canPost() && !daily[today]
      ? `<button class="submit" type="button" data-day="${today}">Bild für heute hochladen</button>`
      : "";
  }

  function chooseDaily(day) {
    pickDay = day;
    $("dailyFile").click();
  }

  // Draws img into a JPEG data URL: the whole picture fitted into size, or a centered square crop
  function toJpeg(img, size, square, quality) {
    const w = img.naturalWidth, h = img.naturalHeight;
    const side = Math.min(w, h);
    const [sx, sy, sw, sh] = square ? [(w - side) / 2, (h - side) / 2, side, side] : [0, 0, w, h];
    const k = Math.min(1, size / Math.max(sw, sh));
    const c = document.createElement("canvas");
    c.width = Math.round(sw * k);
    c.height = Math.round(sh * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#1d2128"; // backdrop for transparent PNGs
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", quality);
  }

  async function uploadDaily(day, file) {
    const url = URL.createObjectURL(file);
    let full, thumb;
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      for (const q of [0.82, 0.7, 0.55, 0.4]) {
        full = toJpeg(img, DAILY_FULL, false, q);
        if (full.length < DAILY_MAX) break;
      }
      thumb = toJpeg(img, DAILY_THUMB, true, 0.7);
    } catch {
      return toast("Das Bild konnte nicht gelesen werden. Probier ein JPG oder PNG.");
    } finally {
      URL.revokeObjectURL(url);
    }
    const backup = daily[day];
    const pic = { ts: Date.now(), by: auth.currentUser.email, thumb };
    daily[day] = pic;
    renderDaily();
    toast("Bild wird hochgeladen…");
    try {
      await write(`/dailyImg/${day}`, "PUT", full);
      await write(`/daily/${day}`, "PUT", pic);
      toast(`Daily Bild für ${shortDayFmt.format(parseDay(day))} gespeichert`);
    } catch {
      if (backup) daily[day] = backup;
      else delete daily[day];
      renderDaily();
      toast("Nicht hochgeladen, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  }

  async function openViewer(day) {
    const pic = daily[day];
    if (!pic) return;
    viewing = day;
    $("viewer-date").textContent = dayFmt.format(parseDay(day));
    $("viewer-img").src = pic.thumb;
    $("viewer-img").alt = `Daily Bild vom ${shortDayFmt.format(parseDay(day))}`;
    $("viewer-meta").textContent = `Hochgeladen von ${pic.by}, ${timeFmt.format(new Date(pic.ts))}`;
    $("viewer-replace").hidden = $("viewer-delete").hidden = !canPost();
    $("viewer").showModal();
    try {
      const res = await fetch(await authed(`/dailyImg/${day}.json`));
      const full = res.ok ? await res.json() : null;
      if (viewing === day && daily[day]?.ts === pic.ts && typeof full === "string") $("viewer-img").src = full;
    } catch {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  $("add").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const brand = $("brand").value, person = $("person").value, flavor = $("flavor").value;
    const id = newId(), entry = { ts: Date.now(), person, brand, flavor, cents: unit(brand) };
    remember("ec-person", person);
    remember("ec-brand", brand);
    if (role === "submitter") {
      const submission = { ...entry, by: auth.currentUser.email, status: "offen" };
      mine[id] = submission;
      renderMine();
      try {
        await write(`/pending/${auth.currentUser.uid}/${id}`, "PUT", submission);
        toast(`Zur Freigabe geschickt: ${person}, ${label(entry)}`);
      } catch {
        delete mine[id];
        renderMine();
        toast("Nicht gesendet, keine Verbindung zur Datenbank. Versuch es nochmal.");
      }
      return;
    }
    store[id] = entry;
    justAdded = id;
    rebuild();
    try {
      await remote(id, "PUT", entry);
      toast(`Eingetragen: ${person}, ${label(entry)}`);
    } catch {
      delete store[id];
      rebuild();
      toast("Nicht gespeichert, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("history").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-id]");
    if (!btn) return;
    const e = entries.find((x) => x.id === btn.dataset.id);
    if (!e || !confirm(`${label(e)} von ${e.person} löschen?`)) return;
    const backup = store[e.id];
    delete store[e.id];
    rebuild();
    try {
      await remote(e.id, "DELETE");
      toast("Gelöscht");
    } catch {
      store[e.id] = backup;
      rebuild();
      toast("Nicht gelöscht, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("review-list").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-ok]");
    if (!btn) return;
    const { uid, id, ok } = btn.dataset;
    const e = pending[uid]?.[id];
    if (!e) return;
    const buttons = btn.parentElement.querySelectorAll("button");
    buttons.forEach((b) => (b.disabled = true));
    try {
      if (ok === "1") await remote(id, "PUT", { ts: e.ts, person: e.person, brand: e.brand, flavor: e.flavor, cents: unit(e.brand) });
      await write(`/pending/${encodeURIComponent(uid)}/${encodeURIComponent(id)}`, "PATCH", { status: ok === "1" ? "angenommen" : "abgelehnt" });
      toast(`${ok === "1" ? "Angenommen" : "Abgelehnt"}: ${label(e)}`);
    } catch {
      buttons.forEach((b) => (b.disabled = false));
      toast("Nicht gespeichert, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("more").addEventListener("click", () => { showAll = !showAll; render(); });

  $("daily").addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-day]");
    if (!btn || btn.disabled) return;
    if (daily[btn.dataset.day]) openViewer(btn.dataset.day);
    else if (canPost()) chooseDaily(btn.dataset.day);
  });
  $("cal-prev").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() - 1); renderDaily(); });
  $("cal-next").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() + 1); renderDaily(); });
  $("dailyFile").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    ev.target.value = "";
    if (file && pickDay) uploadDaily(pickDay, file);
  });
  $("viewer").addEventListener("close", () => { viewing = null; $("viewer-img").removeAttribute("src"); });
  $("viewer").addEventListener("click", (ev) => { if (ev.target === $("viewer")) $("viewer").close(); });
  $("viewer-close").addEventListener("click", () => $("viewer").close());
  $("viewer-replace").addEventListener("click", () => {
    const day = viewing;
    $("viewer").close();
    chooseDaily(day);
  });
  $("viewer-delete").addEventListener("click", async () => {
    const day = viewing;
    if (!confirm(`Daily Bild vom ${shortDayFmt.format(parseDay(day))} löschen?`)) return;
    $("viewer").close();
    const backup = daily[day];
    delete daily[day];
    renderDaily();
    try {
      await write(`/daily/${day}`, "DELETE");
      await write(`/dailyImg/${day}`, "DELETE");
      toast("Bild gelöscht");
    } catch {
      daily[day] = backup;
      renderDaily();
      toast("Nicht gelöscht, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `energy-counter-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("import").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error();
      const fresh = data.filter((e) => e && e.id && e.brand in BRANDS && !(e.id in store));
      await upload(fresh);
      toast(`${fresh.length} Dosen importiert`);
    } catch {
      toast("Import fehlgeschlagen: Die Datei ist kein Export dieser Seite.");
    }
  });

  $("signin").addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
        toast("Anmeldung fehlgeschlagen. Erlaube Pop-ups für diese Seite und versuch es nochmal.");
      }
    }
  });
  $("signout").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    session++;
    closeStreams();
    store = {};
    pending = {};
    mine = {};
    daily = {};
    loaded = false;
    role = !user ? null
      : NEEDS_APPROVAL.includes(user.email) ? "submitter"
      : user.email === ADMIN ? "admin" : "member";
    document.body.dataset.role = role ?? "";
    $("daily").hidden = false;
    if ($("viewer").open) $("viewer").close();
    rebuild();
    renderReview();
    renderMine();
    renderDaily();
    if (!user) return setAuthState("out", "Nur für eingeladene Leute. Melde dich mit deinem Google-Konto an, um Dosen zu sehen und einzutragen.");
    $("who").textContent = `Angemeldet als ${user.email}.`;
    setAuthState("loading", "Lade…");
    startSession();
  });

  setAuthState("loading", "Lade…");
  initForm();
  render();
  renderDaily();
</script>
</body>
</html>
