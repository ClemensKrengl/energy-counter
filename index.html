<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2128">
<title>Energy Counter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 32'><rect x='1' y='2' width='18' height='29' rx='4' fill='%23c9ced6'/><rect x='3' y='0' width='14' height='4' rx='2' fill='%238a919c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #1d2128;
    --raised: #272c35;
    --line: #353b46;
    --text: #e8eaed;
    --muted: #959ca8;
    --silver: #d9dde3;
    --danger: #f08a7e;
    --live: #6fcf8e;
    --redbull: #5b8cf0;
    --clever: #4fbf73;
    --sbudget: #ef6a5b;
    --other: #8a919c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.5 "Archivo", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  .narrow { font-stretch: 72%; font-weight: 750; letter-spacing: -0.01em; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { font-size: 2.5rem; line-height: 1; margin: 0; }
  #status { font-size: .875rem; color: var(--muted); white-space: nowrap; }
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px;
  }
  #status.live { color: var(--live); }
  #status.off { color: var(--danger); }

  /* The shelf: one can per entry, grouped by brand */
  .shelf {
    display: flex; flex-wrap: wrap; gap: 4px 3px;
    margin: 28px 0 20px; min-height: 26px;
  }
  .can {
    width: 14px; height: 24px; position: relative;
    border-radius: 3px 3px 4px 4px;
    background:
      linear-gradient(90deg, rgb(0 0 0 / .18), rgb(255 255 255 / .22) 30%, transparent 55%, rgb(0 0 0 / .22)),
      var(--c);
  }
  .can::before {
    content: ""; position: absolute; left: 1px; right: 1px; top: -2px; height: 4px;
    border-radius: 2px; background: #b9bec7;
  }
  .can.new { animation: drop .45s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  .shelf-empty { color: var(--muted); }

  .totals { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 0 0 40px; }
  .totals div { color: var(--muted); }
  .totals b { font-size: 1.75rem; color: var(--text); margin-right: 6px; }

  form { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; margin-bottom: 48px; }
  label { display: grid; gap: 4px; font-size: .875rem; color: var(--muted); min-width: 0; }
  select, button { font: inherit; color: inherit; }
  select {
    appearance: none; width: 100%; min-width: 0;
    padding: 11px 34px 11px 12px; border-radius: 8px;
    background: var(--raised) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23959ca8' stroke-width='1.6'/></svg>") no-repeat right 12px center;
    border: 1px solid var(--line); color: var(--text);
    text-overflow: ellipsis;
  }
  .submit {
    grid-column: 1 / -1; margin-top: 4px; padding: 14px; border: 0; border-radius: 8px;
    background: var(--silver); color: #1d2128; font-weight: 650; font-size: 1.05rem; cursor: pointer;
  }
  .submit:hover { background: #fff; }
  .submit:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }

  h2 { font-size: 1.5rem; margin: 0 0 8px; }
  section { margin-bottom: 44px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li {
    display: grid; grid-template-columns: 1fr auto 6.5rem; gap: 12px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .rows .n { color: var(--muted); text-align: right; }
  .rows .eur { text-align: right; }
  .swatch { display: inline-block; width: 8px; height: 14px; border-radius: 2px; background: var(--c); margin-right: 10px; vertical-align: -1px; }
  .rows li.zero { color: var(--muted); }

  .log li { grid-template-columns: 1fr auto auto; }
  .log .what { min-width: 0; }
  .log .meta { display: block; font-size: .875rem; color: var(--muted); }
  .link {
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
  }
  .link:hover { color: var(--text); }
  .log .link:hover { color: var(--danger); }
  .more { margin-top: 12px; }

  footer { display: flex; gap: 20px; font-size: .875rem; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    background: var(--silver); color: #1d2128; padding: 10px 16px; border-radius: 8px;
    max-width: calc(100% - 32px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    h1 { font-size: 2rem; }
    form { grid-template-columns: 1fr 1fr; }
    form label:nth-child(3) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .can.new { animation: none; }
    .toast { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="narrow">Energy Counter</h1>
    <span id="status">verbinde</span>
  </header>

  <div class="shelf" id="shelf" aria-label="Alle getrunkenen Dosen"></div>
  <div class="totals" id="totals"></div>

  <form id="add">
    <label>Wer
      <select id="person" required></select>
    </label>
    <label>Marke
      <select id="brand" required></select>
    </label>
    <label>Geschmack
      <select id="flavor" required></select>
    </label>
    <button class="submit" type="submit">Dose eintragen</button>
  </form>

  <section>
    <h2 class="narrow">Marken</h2>
    <ul class="rows" id="brands"></ul>
  </section>

  <section>
    <h2 class="narrow">Leute</h2>
    <ul class="rows" id="people"></ul>
  </section>

  <section>
    <h2 class="narrow">Zuletzt</h2>
    <ul class="rows log" id="history"></ul>
    <button class="link more" id="more" type="button" hidden></button>
  </section>

  <footer>
    <button class="link" id="export" type="button">Daten exportieren</button>
    <button class="link" id="import" type="button">Daten importieren</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
  const PFAND = 25; // cents per can
  const PEOPLE = ["Hut", "Karsten", "Sophie", "Kongi", "Unbekannt", "Gast"];
  const BRANDS = {
    redbull: {
      name: "Red Bull", price: 159, color: "--redbull",
      flavors: [
        "Classic", "Sugarfree", "Zero",
        "Red Edition (Wassermelone)",
        "Blue Edition (Heidelbeere)",
        "Yellow Edition (Tropical)",
        "Green Edition (Kaktusfrucht)",
        "White Edition (Kokos-Blaubeere)",
        "Apricot Edition (Marille-Erdbeere)",
        "Sea Blue Edition (Juneberry)",
        "Peach Edition (White Peach)",
        "Glacier Edition (Gletschereis-Himbeere)",
        "Pink Edition Sugarfree (Waldbeere)",
        "Cherry Edition Sugarfree (Kirsche-Sakura)",
        "Winter Edition (Pistazie)",
        "Winter Edition Sugarfree (Pistazie)",
        "Sugarfree Sudachi",
        "Summer Edition",
        "Andere",
      ],
    },
    clever: {
      name: "clever Energy", price: 49, color: "--clever",
      flavors: [
        "Classic", "Sugarfree", "Zero", "Kiwi", "Erdbeer-Limette",
        "Honigmelone", "Ananas", "Heidelbeere", "White Peach", "Juneberry",
        "Marille-Holler", "Drachenfrucht", "Andere",
      ],
    },
    sbudget: {
      name: "S-Budget Energy", price: 59, color: "--sbudget",
      flavors: [
        "Classic", "Sugarfree", "Sugarfree Limette", "Energy Cola",
        "Heidelbeere", "Kirsche", "Kirsche-Banane", "Pfirsich", "Limette", "Cranberry", "Wassermelone",
        "Marille-Erdbeere", "Kokos-Heidelbeere", "Juneberry",
        "Tutti Frutti", "1001 Nacht", "Andere",
      ],
    },
    other: {
      name: "Unbekannt/Gast", price: 0, color: "--other",
      flavors: ["Unbekannt", "Gastdose"],
    },
  };
  const DB_URL = "https://energy-counter-4ahitm-default-rtdb.europe-west1.firebasedatabase.app";
  const LEGACY_KEY = "energy-counter-v1"; // entries saved locally before the sync existed
  const LOG_SHORT = 12;

  const $ = (id) => document.getElementById(id);
  const euro = (cents) => (cents / 100).toLocaleString("de-AT", { style: "currency", currency: "EUR" });
  const unit = (brand) => BRANDS[brand].price + PFAND;
  const label = (e) => e.brand === "other" ? e.flavor : `${BRANDS[e.brand].name} ${e.flavor}`;

  // Firebase Realtime Database, spoken to over its REST API; `store` mirrors /entries as {id: entry}.
  let store = {};
  let entries = [];
  let loaded = false;
  let showAll = false;
  let justAdded = null;

  function rebuild() {
    entries = Object.entries(store)
      .filter(([, e]) => e && e.brand in BRANDS)
      .map(([id, e]) => ({ id, ...e }))
      .sort((a, b) => a.ts - b.ts);
    render();
  }

  function setStatus(text, cls) {
    $("status").textContent = text;
    $("status").className = cls;
  }

  function connect() {
    const es = new EventSource(`${DB_URL}/entries.json`);
    es.addEventListener("put", (ev) => {
      const { path, data } = JSON.parse(ev.data);
      if (path === "/") store = data || {};
      else applyChild(path.slice(1), data);
      if (!loaded) { loaded = true; migrateLegacy(); }
      setStatus("live", "live");
      rebuild();
    });
    es.addEventListener("patch", (ev) => {
      const { path, data } = JSON.parse(ev.data);
      if (path === "/") for (const [id, e] of Object.entries(data)) applyChild(id, e);
      rebuild();
    });
    es.addEventListener("open", () => setStatus("live", "live"));
    es.addEventListener("error", () => setStatus("offline", "off"));
  }

  function applyChild(path, data) {
    const [id, field] = path.split("/");
    if (field) {
      if (store[id]) store[id][field] = data;
    } else if (data === null) {
      delete store[id];
    } else {
      store[id] = data;
    }
  }

  async function remote(id, method, entry) {
    const res = await fetch(`${DB_URL}/entries/${encodeURIComponent(id)}.json`, {
      method,
      body: entry ? JSON.stringify(entry) : undefined,
    });
    if (!res.ok) throw new Error(res.status);
  }

  async function upload(list) {
    await Promise.all(list.map(({ id, ts, person, brand, flavor, cents }) =>
      remote(id, "PUT", { ts, person, brand, flavor, cents })));
  }

  async function migrateLegacy() {
    let legacy;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || []; } catch { return; }
    const fresh = legacy.filter((e) => e && e.id && e.brand in BRANDS && !(e.id in store));
    try {
      await upload(fresh);
      localStorage.removeItem(LEGACY_KEY);
      if (fresh.length) toast(`${fresh.length} lokal gespeicherte Dosen hochgeladen`);
    } catch {}
  }

  function fillSelect(sel, options) {
    sel.innerHTML = "";
    for (const [value, label] of options) sel.add(new Option(label, value));
  }

  function remember(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }
  function recall(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }

  function initForm() {
    fillSelect($("person"), PEOPLE.map((p) => [p, p]));
    fillSelect($("brand"), Object.entries(BRANDS).map(([k, b]) => [k, `${b.name}, ${euro(unit(k))}`]));
    const lastPerson = recall("ec-person"), lastBrand = recall("ec-brand");
    if (PEOPLE.includes(lastPerson)) $("person").value = lastPerson;
    if (lastBrand in BRANDS) $("brand").value = lastBrand;
    updateFlavors();
    $("brand").addEventListener("change", updateFlavors);
  }

  function updateFlavors() {
    fillSelect($("flavor"), BRANDS[$("brand").value].flavors.map((f) => [f, f]));
  }

  function render() {
    const brandKeys = Object.keys(BRANDS);
    const byBrand = Object.fromEntries(brandKeys.map((k) => [k, 0]));
    const byPerson = Object.fromEntries(PEOPLE.map((p) => [p, { n: 0, cents: 0 }]));
    let cents = 0;
    for (const e of entries) {
      cents += e.cents;
      byBrand[e.brand]++;
      const p = byPerson[e.person] ??= { n: 0, cents: 0 };
      p.n++;
      p.cents += e.cents;
    }

    const shelf = brandKeys.flatMap((k) => entries.filter((e) => e.brand === k));
    $("shelf").innerHTML = shelf.length
      ? shelf.map((e) => `<span class="can${e.id === justAdded ? " new" : ""}" style="--c: var(${BRANDS[e.brand].color})"
          title="${esc(`${label(e)}, ${e.person}`)}"></span>`).join("")
      : `<span class="shelf-empty">Noch keine Dosen. Trag unten die erste ein.</span>`;
    justAdded = null;

    $("totals").innerHTML = `
      <div><b class="narrow">${entries.length}</b>${entries.length === 1 ? "Dose" : "Dosen"}</div>
      <div><b class="narrow">${euro(cents)}</b>ausgegeben</div>
      <div><b class="narrow">${euro(entries.length * PFAND)}</b>Pfand</div>`;

    $("brands").innerHTML = brandKeys.map((k) => `
      <li class="${byBrand[k] ? "" : "zero"}">
        <span><span class="swatch" style="--c: var(${BRANDS[k].color})"></span>${BRANDS[k].name}</span>
        <span class="n">${byBrand[k]}</span>
        <span class="eur">${euro(byBrand[k] * unit(k))}</span>
      </li>`).join("");

    $("people").innerHTML = Object.entries(byPerson)
      .sort((a, b) => b[1].n - a[1].n)
      .map(([name, p]) => `
        <li class="${p.n ? "" : "zero"}">
          <span>${esc(name)}</span>
          <span class="n">${p.n}</span>
          <span class="eur">${euro(p.cents)}</span>
        </li>`).join("");

    const recent = [...entries].reverse();
    const shown = showAll ? recent : recent.slice(0, LOG_SHORT);
    const fmt = new Intl.DateTimeFormat("de-AT", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
    $("history").innerHTML = shown.length
      ? shown.map((e) => `
        <li>
          <span class="what">${esc(label(e))}
            <span class="meta">${esc(e.person)}, ${fmt.format(new Date(e.ts))}</span></span>
          <span class="eur">${euro(e.cents)}</span>
          <button class="link" data-id="${e.id}" type="button">Löschen</button>
        </li>`).join("")
      : `<li class="zero"><span>Hier erscheinen die zuletzt eingetragenen Dosen.</span></li>`;
    $("more").hidden = recent.length <= LOG_SHORT;
    $("more").textContent = showAll ? "Weniger anzeigen" : `Alle ${recent.length} anzeigen`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  $("add").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const brand = $("brand").value, person = $("person").value, flavor = $("flavor").value;
    const id = newId(), entry = { ts: Date.now(), person, brand, flavor, cents: unit(brand) };
    remember("ec-person", person);
    remember("ec-brand", brand);
    store[id] = entry;
    justAdded = id;
    rebuild();
    try {
      await remote(id, "PUT", entry);
      toast(`Eingetragen: ${person}, ${label(entry)}`);
    } catch {
      delete store[id];
      rebuild();
      toast("Nicht gespeichert, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("history").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-id]");
    if (!btn) return;
    const e = entries.find((x) => x.id === btn.dataset.id);
    if (!e || !confirm(`${label(e)} von ${e.person} löschen?`)) return;
    const backup = store[e.id];
    delete store[e.id];
    rebuild();
    try {
      await remote(e.id, "DELETE");
      toast("Gelöscht");
    } catch {
      store[e.id] = backup;
      rebuild();
      toast("Nicht gelöscht, keine Verbindung zur Datenbank. Versuch es nochmal.");
    }
  });

  $("more").addEventListener("click", () => { showAll = !showAll; render(); });

  $("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `energy-counter-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("import").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error();
      const fresh = data.filter((e) => e && e.id && e.brand in BRANDS && !(e.id in store));
      await upload(fresh);
      toast(`${fresh.length} Dosen importiert`);
    } catch {
      toast("Import fehlgeschlagen: Die Datei ist kein Export dieser Seite.");
    }
  });

  initForm();
  render();
  connect();
</script>
</body>
</html>
